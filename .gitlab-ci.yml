stages:
  - validate
  - build

backend_tests:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir -r backend/requirements.txt
    - pip install --no-cache-dir pytest
    - python -m compileall backend

frontend_build:
  stage: validate
  image: node:22
  script:
    - cd web
    - npm ci
    - npm run build

terraform_validate:
  stage: validate
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  parallel:
    matrix:
      - TF_DIRECTORY:
          - terraform/azure-vm
          - terraform/azure-foundry
  script:
    - cd "$TF_DIRECTORY"
    - terraform init -backend=false
    - terraform validate

backend_image:
  stage: build
  image: docker:cli
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    API_IMAGE: "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$API_IMAGE" backend
    - docker push "$API_IMAGE"
    - docker logout "$CI_REGISTRY"

production_compose_validate:
  stage: validate
  image: docker:cli
  variables:
    API_IMAGE: "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    MEILI_MASTER_KEY: "ci-validation-placeholder"
  script:
    - |
      cat > .env <<'EOF'
      MEILISEARCH_URL=http://meilisearch:7700
      MEILISEARCH_KEY=ci-validation-placeholder
      MEILI_MASTER_KEY=ci-validation-placeholder
      AZURE_INFERENCE_ENDPOINT=https://example.invalid
      AZURE_FOUNDRY_API_KEY=ci-validation-placeholder
      AZURE_EMBEDDING_MODEL=ci-validation-placeholder
      AZURE_CHAT_MODEL=k8s-chat
      EOF
    - docker compose -f infrastructure/compose.production.yaml config
    - rm -f .env